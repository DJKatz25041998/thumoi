<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Date Với Anh Nhé?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-icons" id="floating-icons"></div>
    
    <div class="rain-container" id="rain-container"></div>

    <div class="container" id="question-screen">
        <img src="1.gif" alt="Cute Cat" class="main-image" id="cat-image">
        <h1>Mình gặp nhau đi date lần nữa nhé?</h1>
        <div class="message-text" id="status-message">22:20 ngày 1/9 này nha em!</div>
        <div class="buttons">
            <button id="yes-btn">YES</button>
            <button id="no-btn">NO</button>
        </div>
    </div>

    <div class="container" id="transition-screen">
        <img src="10.jpg" alt="Cat Love" class="main-image">
        <h1>Yayyyy! 🥰</h1>
        <p style="color: #ff4081; font-weight: bold;">Đợi anh một chút nhé...</p>
    </div>

    <div id="success-screen">
        <h1>Tuyệt vờiiii! ❤️</h1>
        <p style="color: #ff4081; font-weight: bold;">Chốt lịch lúc 22:20 ngày 1/9 nhé!</p>
        <div class="couple-images">
            <img src="8.jpg" alt="Kỷ niệm 1">
            <img src="9.jpg" alt="Kỷ niệm 2">
        </div>
        <div class="special-message">
            💖 <b>Gửi em:</b><br>
            Lần trước đi chơi với em vui quá làm anh cứ nghĩ mãi. Anh sẽ qua đón em đúng giờ nhé!
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
